name: Kind CI


on:
  pull_request:
    branches:
      - main    
      
permissions:           
  contents: read
  pull-requests: write  
  issues: write        

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Vegeta # for load testing
        run: |
          if ! command -v vegeta &>/dev/null; then
            brew install vegeta
          fi
          vegeta -version
      
      - name: Set up KinD cluster # spin up kind cluster
        run: |
          if ! command -v kind &>/dev/null; then
            brew install kind
          fi
          kind create cluster --name ci-cluster --config cluster.yaml --wait 5m
      
      - name: Set up kubectl # make sure kubectl is installed and can access the kind cluster
        run: |
          if ! command -v kubectl &>/dev/null; then
            brew install kubectl
          fi
          kubectl cluster-info --context kind-ci-cluster
      
      - name: Install NGINX Ingress Controller 
        run: |
          kubectl apply -f ingress-nginx-resources.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s
      
      - name: Deploy foo and bar services
        run: |
          kubectl apply -f foo-deployment.yaml
          kubectl apply -f foo-svc.yaml
          kubectl apply -f bar-deployment.yaml
          kubectl apply -f bar-svc.yaml
          kubectl apply -f ingress.yaml
          kubectl wait --namespace ingress-nginx --for=condition=available deployment/foo --timeout=120s
          kubectl wait --namespace ingress-nginx --for=condition=available deployment/bar --timeout=120s
          kubectl wait --namespace ingress-nginx --for=condition=ready pod -l app=foo --timeout=120s
          kubectl wait --namespace ingress-nginx --for=condition=ready pod -l app=bar --timeout=120s
        
      - name: Update portforwarding for NGINX Ingress Controller
        run: |
          nohup $(command -v kubectl) port-forward svc/ingress-nginx-controller -n ingress-nginx 8080:80 > port-forward.log 2>&1 &

          # Wait until NGINX serves the foo.local ingress
          echo "Waiting for NGINX to pick up Ingress rules..."
          until curl -s -o /dev/null -w "%{http_code}" -H "Host: foo.local" http://localhost:8080/ | grep -q 200; do
            sleep 1
          done

          # Wait until NGINX serves the bar.local ingress
          until curl -s -o /dev/null -w "%{http_code}" -H "Host: bar.local" http://localhost:8080/ | grep -q 200; do
            sleep 1
          done
          
          sleep 5
          
      - name: Create Vegeta targets
        run: |
          cat <<EOF > targets.txt
          GET http://localhost:8080/
          Host: foo.local
      
          GET http://localhost:8080/
          Host: bar.local
          EOF
      
      - name: Run Vegeta attack
        run: |
          vegeta attack -targets=targets.txt -duration=10s -rate=50 | vegeta report > full_report.txt
      
      - name: Post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the report content from the file
          REPORT_CONTENT=$(cat full_report.txt)
          echo REPORT_CONTENT
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          echo PR_NUMBER
          
          # Post the report as a comment on the PR
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "### Vegeta Load Test Report\n\`\`\`\n$REPORT_CONTENT\n\`\`\`" '{body: $body}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$PR_NUMBER/comments"
            

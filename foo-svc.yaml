apiVersion: v1
kind: Service
metadata:
  name: foo
  namespace: ingress-nginx 
spec:
  selector:
    app: foo
  ports:
    - protocol: TCP
      port: 80        # Port exposed by the Service (for the Ingress to route traffic to)
      targetPort: 5678 # The port inside the container where http-echo is listening
  type: ClusterIP
